name: Prueba fotos de la fuente
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests pillow
      - run: |
          mkdir -p prueba
          python - <<'PY' > prueba/resultado.txt 2>&1
          import requests, sys
          sys.path.insert(0, 'scripts')
          import fuentes
          for u in ['https://www.merca20.com/starbucks-mexico-lanza-su-primera-colaboracion-con-owala-y-asi-renueva-su-estrategia-de-merchandising/',
                    'https://www.merca20.com/wp-json/wp/v2/posts?slug=starbucks-mexico-lanza-su-primera-colaboracion-con-owala-y-asi-renueva-su-estrategia-de-merchandising&_embed=wp:featuredmedia',
                    'https://wersm.com/uno-turns-its-iconic-card-game-into-a-limited-edition-sneaker-drop/',
                    'https://wersm.com/wp-json/wp/v2/posts?slug=uno-turns-its-iconic-card-game-into-a-limited-edition-sneaker-drop&_embed=wp:featuredmedia']:
              try:
                  r = requests.get(u, headers=fuentes.UA, timeout=25)
                  print('==', r.status_code, len(r.text), u[:90]); print(r.text[:400].replace('\n', ' ')); 
                  import re
                  print('og', re.findall(r'og:image[^>]{0,200}', r.text)[:2]); print('src_url', re.findall(r'"source_url":"([^"]+)"', r.text)[:2])
              except Exception as e:
                  print('ERR', u, e)
          PY
          git config user.name bot; git config user.email bot@x
          git checkout -b prueba-fotos
          git add -f prueba && git commit -qm prueba && git push -f origin prueba-fotos
