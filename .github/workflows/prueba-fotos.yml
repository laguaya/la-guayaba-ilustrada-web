name: Prueba fotos de la fuente
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests pillow
      - run: |
          mkdir -p prueba
          python - <<'PY' > prueba/resultado.txt 2>&1
          import json, sys, os, shutil
          sys.path.insert(0, 'scripts')
          import fuentes
          from PIL import Image
          posts = [json.loads(l.strip().rstrip(',')) for l in open('posts.js', encoding='utf-8') if l.strip().startswith('{"id"')][:8]
          thumbs = []
          for p in posts:
              print('==', p['id'], p.get('src'))
              print('   urls:', fuentes.urls_de_pagina(p.get('src', ''))[:10])
              r = fuentes.candidatas(p, '/tmp/c')
              for f in r:
                  print('   ', f, Image.open(f).size); thumbs.append(f)
          if thumbs:
              W = 6; s = 300
              c = Image.new('RGB', (W * s, ((len(thumbs) + W - 1) // W) * s), 'white')
              for i, f in enumerate(thumbs):
                  im = Image.open(f); im.thumbnail((s - 6, s - 6)); c.paste(im, ((i % W) * s, (i // W) * s))
              c.save('prueba/hoja.jpg', quality=80)
          PY
          git config user.name bot; git config user.email bot@x
          git checkout -b prueba-fotos
          git add -f prueba && git commit -qm prueba && git push -f origin prueba-fotos
