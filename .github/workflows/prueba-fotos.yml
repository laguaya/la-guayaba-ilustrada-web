name: Prueba fotos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: (sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr ffmpeg) >/dev/null 2>&1 || true
      - run: pip install -q requests pillow "opencv-contrib-python-headless<5"
      - run: |
          mkdir -p out
          python3 - <<'PY' > out/reporte.txt 2>&1
          import sys, json
          sys.path.insert(0, 'scripts')
          import fuentes as F
          n = json.load(open('drafts/mcdonalds-happy-view-caja-examen-vista.json'))
          fs = F.buscar_fuentes(n['t'], excluir=('reasonwhy.es',))
          print('fuentes:', fs)
          n['fuentes'] = fs; n['id'] = 'prueba-mc'
          print('candidatas:', F.candidatas(n, 'out', maximo=6, registro={}))
          PY
          cat out/reporte.txt
      - run: |
          git config user.name bot; git config user.email bot@x
          git checkout -b prueba-fotos
          git add -f out && git commit -qm prueba && git push -f origin prueba-fotos
