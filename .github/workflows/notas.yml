name: Notas por Telegram

# El bot escucha Telegram sin parar: cada ejecución dura ~5.6 horas
# y al terminar se vuelve a lanzar sola. El horario solo sirve de respaldo
# por si algún relevo falla.
on:
  push:
    branches: [main]
    paths: ['scripts/notas.py', 'scripts/carrusel.py', 'scripts/portada.py', 'scripts/fuentes.py', 'scripts/reel.py', 'scripts/carrusel_video.py', 'scripts/encuadre.py', 'scripts/voz.py', 'scripts/tomas.py', '.github/workflows/notas.yml']
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: notas
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: (sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr ffmpeg) >/dev/null 2>&1 || true
      - uses: denoland/setup-deno@v2   # yt-dlp lo necesita para YouTube
        with:
          deno-version: v2.x
      - run: pip install -q requests pillow fonttools brotli "opencv-contrib-python-headless<5" pillow-heif edge-tts cryptography "yt-dlp[default,curl-cffi]" faster-whisper
      - env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: '8941716448'
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID || vars.ELEVENLABS_VOICE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u scripts/notas.py --listen
