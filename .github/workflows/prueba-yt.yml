name: prueba-yt
on:
  push:
    paths: ['.github/workflows/prueba-yt.yml']
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: |
          pip install -q "yt-dlp[default]" requests
          mkdir -p /tmp/o
          for u in "https://www.youtube.com/watch?v=jNQXAC9IVRw" "https://www.youtube.com/watch?v=ArbK6yriSfw" "https://www.youtube.com/shorts/ArbK6yriSfw"; do
            yt-dlp --no-playlist -f "b[height<=720]/b" -o /tmp/v.mp4 --force-overwrites "$u" >> /tmp/o/yt.txt 2>&1 || true
            ls -la /tmp/v.mp4 >> /tmp/o/yt.txt 2>&1 || true; rm -f /tmp/v.mp4
          done
          yt-dlp --no-playlist -o /tmp/v.mp4 "https://www.tiktok.com/@mccainfoods" -I 1 >> /tmp/o/yt.txt 2>&1 || true
          git config user.name "La Guayaba Ilustrada"; git config user.email "laguayabailustrada@gmail.com"
          git checkout --orphan prueba-yt2 && git rm -rqf . && cp /tmp/o/* . && git add *.txt && git commit -qm yt && git push -f origin prueba-yt2
