name: prueba-yt
on:
  push:
    paths: ['.github/workflows/prueba-yt.yml']
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg) >/dev/null 2>&1 || true
          pip install -q requests pillow fonttools brotli "opencv-contrib-python-headless<5" faster-whisper
          mkdir -p /tmp/o
          python scripts/_yt_test.py > /tmp/o/r.txt 2>&1 || true
          git config user.name "La Guayaba Ilustrada"; git config user.email "laguayabailustrada@gmail.com"
          git checkout --orphan prueba-yt9 && git rm -rqf . && cp /tmp/o/r.txt . && git add r.txt && git commit -qm t && git push -f origin prueba-yt9
