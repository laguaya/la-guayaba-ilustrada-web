name: prueba-yt
on:
  push:
    paths: ['.github/workflows/prueba-yt.yml']
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q requests
          mkdir -p /tmp/o
          python scripts/_yt_test.py > /tmp/o/r.txt 2>&1 || true
          git config user.name "La Guayaba Ilustrada"; git config user.email "laguayabailustrada@gmail.com"
          git checkout --orphan prueba-yt6 && git rm -rqf . && cp /tmp/o/r.txt . && git add r.txt && git commit -qm t && git push -f origin prueba-yt6
