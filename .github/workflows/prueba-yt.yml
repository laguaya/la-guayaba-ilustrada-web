name: prueba-yt
on:
  push:
    paths: ['.github/workflows/prueba-yt.yml']
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -q requests pillow faster-whisper || true
          mkdir -p /tmp/o
          python -c "import sys; sys.path.insert(0,'scripts'); import fuentes; print(fuentes.mp4s_de_pagina('https://www.adsoftheworld.com/campaigns/halloween-mode'))" > /tmp/o/r.txt 2>&1 || true
          python -c "from faster_whisper import WhisperModel; WhisperModel('base',device='cpu',compute_type='int8'); print('whisper ok')" >> /tmp/o/r.txt 2>&1 || true
          git config user.name "La Guayaba Ilustrada"; git config user.email "laguayabailustrada@gmail.com"
          git checkout --orphan prueba-yt4 && git rm -rqf . && cp /tmp/o/r.txt . && git add r.txt && git commit -qm t && git push -f origin prueba-yt4
