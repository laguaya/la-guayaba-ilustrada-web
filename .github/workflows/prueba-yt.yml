name: prueba-yt
on:
  push:
    paths: ['.github/workflows/prueba-yt.yml']
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q requests faster-whisper
          mkdir -p /tmp/o
          python - > /tmp/o/r.txt 2>&1 <<'PY'
          import sys; sys.path.insert(0,'scripts')
          import fuentes
          print(fuentes.mp4s_de_pagina('https://www.adsoftheworld.com/campaigns/halloween-mode'))
          from faster_whisper import WhisperModel
          m=WhisperModel('base',device='cpu',compute_type='int8'); print('whisper ok')
          PY
          git config user.name "La Guayaba Ilustrada"; git config user.email "laguayabailustrada@gmail.com"
          git checkout --orphan prueba-yt3 && git rm -rqf . && cp /tmp/o/* . && git add *.txt && git commit -qm t && git push -f origin prueba-yt3
