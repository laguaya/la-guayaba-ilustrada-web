name: prueba-yt
on:
  push:
    paths: ['.github/workflows/prueba-yt.yml']
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q yt-dlp requests
          (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg) >/dev/null 2>&1 || true
          mkdir -p /tmp/o
          yt-dlp --no-playlist -f "b[height<=720][ext=mp4]/b" -o /tmp/v1.mp4 "https://www.youtube.com/watch?v=yBkvQbCuQYE" > /tmp/o/yt.txt 2>&1 || true
          ls -la /tmp/v1.mp4 >> /tmp/o/yt.txt 2>&1 || true
          yt-dlp --no-playlist -o /tmp/v2.mp4 "https://www.adsoftheworld.com/campaigns/together-is-golden" > /tmp/o/aotw.txt 2>&1 || true
          ls -la /tmp/v2*.mp4 >> /tmp/o/aotw.txt 2>&1 || true
          yt-dlp --no-playlist -f "b[height<=720]/b" -o /tmp/v3.mp4 "https://vimeo.com/76979871" > /tmp/o/vimeo.txt 2>&1 || true
          ls -la /tmp/v3.mp4 >> /tmp/o/vimeo.txt 2>&1 || true
          git config user.name "La Guayaba Ilustrada"; git config user.email "laguayabailustrada@gmail.com"
          git checkout --orphan prueba-yt && git rm -rqf . && cp /tmp/o/* . && git add *.txt && git commit -qm yt && git push -f origin prueba-yt
