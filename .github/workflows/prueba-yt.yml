name: prueba-yt
on:
  push:
    paths: ['.github/workflows/prueba-yt.yml']
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -q requests pillow faster-whisper || true
          mkdir -p /tmp/o
          python -c "import sys; sys.path.insert(0,'scripts'); import fuentes; h=fuentes.pagina('https://www.manufacturing.net/home/video/22976410/rivian-aint-afraid-of-no-ghosts-ev-maker-deploys-ghostbusters-themed-software-update'); import re; print('https://www.manufacturing.net/home/video/22976410/', fuentes.mp4s_de_pagina('https://www.manufacturing.net/home/video/22976410/rivian-aint-afraid-of-no-ghosts-ev-maker-deploys-ghostbusters-themed-software-update'), re.findall(r'(?:jwplayer|brightcove|youtube.com/embed/[\w-]+|player.vimeo.com/video/\d+|m3u8)', h)[:4])" >> /tmp/o/r.txt 2>&1 || true
          python -c "import sys; sys.path.insert(0,'scripts'); import fuentes; h=fuentes.pagina('https://interestingengineering.com/photo-story/rivian-evs-get-ghostbusters-makeover'); import re; print('https://interestingengineering.com/photo-story/riv', fuentes.mp4s_de_pagina('https://interestingengineering.com/photo-story/rivian-evs-get-ghostbusters-makeover'), re.findall(r'(?:jwplayer|brightcove|youtube.com/embed/[\w-]+|player.vimeo.com/video/\d+|m3u8)', h)[:4])" >> /tmp/o/r.txt 2>&1 || true
          python -c "import sys; sys.path.insert(0,'scripts'); import fuentes; h=fuentes.pagina('https://www.techradar.com/vehicle-tech/hybrid-electric-vehicles/just-silly-enough-to-be-perfect-ive-seen-rivians-ghostbusters-ecto-r1-in-action'); import re; print('https://www.techradar.com/vehicle-tech/hybrid-elec', fuentes.mp4s_de_pagina('https://www.techradar.com/vehicle-tech/hybrid-electric-vehicles/just-silly-enough-to-be-perfect-ive-seen-rivians-ghostbusters-ecto-r1-in-action'), re.findall(r'(?:jwplayer|brightcove|youtube.com/embed/[\w-]+|player.vimeo.com/video/\d+|m3u8)', h)[:4])" >> /tmp/o/r.txt 2>&1 || true
          python -c "import sys; sys.path.insert(0,'scripts'); import fuentes; h=fuentes.pagina('https://www.complex.com/pop-culture/a/will-lavin/bill-murray-rivian-ghostbusters-commercial-watch'); import re; print('https://www.complex.com/pop-culture/a/will-lavin/b', fuentes.mp4s_de_pagina('https://www.complex.com/pop-culture/a/will-lavin/bill-murray-rivian-ghostbusters-commercial-watch'), re.findall(r'(?:jwplayer|brightcove|youtube.com/embed/[\w-]+|player.vimeo.com/video/\d+|m3u8)', h)[:4])" >> /tmp/o/r.txt 2>&1 || true
          python -c "import sys; sys.path.insert(0,'scripts'); import fuentes; h=fuentes.pagina('https://www.dreadcentral.com/merch/592732/bill-murray-ghostbusters-rivian-commercial/'); import re; print('https://www.dreadcentral.com/merch/592732/bill-mur', fuentes.mp4s_de_pagina('https://www.dreadcentral.com/merch/592732/bill-murray-ghostbusters-rivian-commercial/'), re.findall(r'(?:jwplayer|brightcove|youtube.com/embed/[\w-]+|player.vimeo.com/video/\d+|m3u8)', h)[:4])" >> /tmp/o/r.txt 2>&1 || true
          python -c "import sys; sys.path.insert(0,'scripts'); import fuentes; h=fuentes.pagina('https://electrek.co/?p=487045'); import re; print('https://electrek.co/?p=487045', fuentes.mp4s_de_pagina('https://electrek.co/?p=487045'), re.findall(r'(?:jwplayer|brightcove|youtube.com/embed/[\w-]+|player.vimeo.com/video/\d+|m3u8)', h)[:4])" >> /tmp/o/r.txt 2>&1 || true
          python -c "import sys; sys.path.insert(0,'scripts'); import fuentes; h=fuentes.pagina('https://news.designrush.com/rivian-ghostbusters-bill-murray-halloween-ecto-r1'); import re; print('https://news.designrush.com/rivian-ghostbusters-bi', fuentes.mp4s_de_pagina('https://news.designrush.com/rivian-ghostbusters-bill-murray-halloween-ecto-r1'), re.findall(r'(?:jwplayer|brightcove|youtube.com/embed/[\w-]+|player.vimeo.com/video/\d+|m3u8)', h)[:4])" >> /tmp/o/r.txt 2>&1 || true
          git config user.name "La Guayaba Ilustrada"; git config user.email "laguayabailustrada@gmail.com"
          git checkout --orphan prueba-yt5 && git rm -rqf . && cp /tmp/o/r.txt . && git add r.txt && git commit -qm t && git push -f origin prueba-yt5
