name: Prueba reel
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: (sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr ffmpeg) >/dev/null 2>&1 || true
      - run: pip install -q requests pillow fonttools brotli "opencv-contrib-python-headless<5" edge-tts
      - run: |
          mkdir -p out
          python3 - <<'PY' > out/reporte.txt 2>&1
          import json, sys
          sys.path.insert(0, 'scripts')
          import reel
          d = json.load(open('drafts/ig/haribo-twin-snakes-dulce-o-acido.json'))
          d['img'] = 'assets/work/nota-haribo-twin-snakes-dulce-o-acido-foto-src1.webp'
          d['mp4'] = 'https://video.adsoftheworld.com/bvwnwsdyt616rxlwchlxwwujy3p1.mp4'
          d['guion'] = ('¿Dulce primero o ácido primero? Con esa pregunta HARIBO armó todo un comercial. '
                        'Las Twin Snakes son gomitas con forma de dos víboras pegadas, una mitad dulce y la otra ácida. '
                        'En el spot, dos hermanas pelirrojas discuten en una banca por dónde se empiezan, y las voces que oyes son de niños de verdad. '
                        'Lo hizo la agencia Quiet Storm y ya pasa en Disney más y Hulu. '
                        'La lección es simple: si tus clientes ya discuten por algo de tu producto, ahí tienes tu próximo anuncio. '
                        'La nota completa está en el link de la bio.')
          print(reel.make(d, 'out/reel-haribo.mp4'))
          PY
          cat out/reporte.txt
      - run: |
          git config user.name bot; git config user.email bot@x
          git checkout -b prueba-reel
          git add -f out && git commit -qm prueba && git push -f origin prueba-reel
