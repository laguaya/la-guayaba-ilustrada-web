name: Guías de prueba
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'ids separados por espacio (vacío = todas)'
        default: ''
permissions:
  contents: write
jobs:
  guias:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          for i in 1 2 3; do (timeout 240 sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq ffmpeg) && break; sleep 10; done
          if ! command -v ffmpeg; then
            curl -sL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar xJ -C /tmp
            sudo cp /tmp/ffmpeg-*-static/ffmpeg /tmp/ffmpeg-*-static/ffprobe /usr/local/bin/
          fi
          ffmpeg -version | head -1
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pip install -q requests pillow fonttools brotli edge-tts "yt-dlp[default,curl-cffi]"
      - env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID || vars.ELEVENLABS_VOICE_ID }}
        run: python -u scripts/guias_prueba.py ${{ inputs.ids }}
      - if: always()
        run: |
          git config user.name "LGI Bot"; git config user.email "bot@guayabailustrada.com.mx"
          git add assets/prueba && git commit -m "Guías de prueba" || exit 0
          for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
