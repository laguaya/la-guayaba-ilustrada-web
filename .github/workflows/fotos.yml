name: Fotos libres
on:
  workflow_dispatch:
    inputs:
      consultas:
        description: 'JSON {"slug": "consulta"}'
        required: true
      n:
        default: '6'
      tipo:
        description: 'fotos o videos'
        default: 'fotos'
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: pip install requests pillow
      - if: inputs.tipo == 'videos'
        run: |
          for i in 1 2 3; do (timeout 240 sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq ffmpeg) && break; sleep 10; done
          if ! command -v ffmpeg; then
            curl -sL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar xJ -C /tmp
            sudo cp /tmp/ffmpeg-*-static/ffmpeg /tmp/ffmpeg-*-static/ffprobe /usr/local/bin/
          fi
          ffmpeg -version | head -1
      - if: inputs.tipo == 'videos'
        run: python scripts/fotos_libres.py videos '${{ inputs.consultas }}' '${{ inputs.n }}'
      - if: inputs.tipo != 'videos'
        run: python scripts/fotos_libres.py '${{ inputs.consultas }}' '${{ inputs.n }}'
      - run: |
          git config user.name "LGI Bot"; git config user.email "bot@guayabailustrada.com.mx"
          git add assets/libres assets/libres_v 2>/dev/null; git add -A assets/libres* && git commit -m "Fotos libres para Guías" || exit 0
          for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
