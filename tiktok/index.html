<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Conectar TikTok · La Guayaba Ilustrada</title>
<style>
@font-face{font-family:"Linear Grotesk";src:url("/assets/lg-regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Linear Grotesk";src:url("/assets/lg-black.woff2") format("woff2");font-weight:900}
body{margin:0;background:#fff;color:#000;font-family:"Linear Grotesk","Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.55;padding:40px 16px}
main{max-width:620px;margin:0 auto}
h1{font-weight:900;font-size:clamp(32px,7vw,48px);line-height:1;letter-spacing:-.035em;margin:0 0 14px}
textarea{width:100%;box-sizing:border-box;font:15px/1.4 ui-monospace,Menlo,monospace;padding:12px;border:1px solid #ddd;border-radius:10px;min-height:120px;margin:12px 0}
button{font:inherit;font-weight:900;background:#FF3674;color:#fff;border:0;border-radius:999px;padding:14px 26px;cursor:pointer}
.ok{color:#565656;font-size:15px;margin-top:10px}
</style>
</head>
<body><main>
<h1 id="t">Conectar TikTok</h1>
<div id="c"></div>
</main>
<script>
var p=new URLSearchParams(location.search),c=document.getElementById('c');
if(p.get('code')){
  var m='tiktok '+p.get('code');
  c.innerHTML='<p>Ya casi. Copia este mensaje y mándaselo tal cual al bot <b>LGI Notas</b> en Telegram:</p><textarea id="m" readonly></textarea><button id="b">Copiar mensaje</button><p class="ok" id="ok"></p>';
  document.getElementById('m').value=m;
  document.getElementById('b').onclick=function(){var t=document.getElementById('m');t.select();try{navigator.clipboard.writeText(m)}catch(e){document.execCommand('copy')}document.getElementById('ok').textContent='Copiado. Pégalo en Telegram.'};
}else if(p.get('error')){
  c.innerHTML='<p>TikTok no dio el permiso ('+(p.get('error_description')||p.get('error')).replace(/[<>]/g,'')+'). Vuelve a escribir "tiktok" al bot para intentarlo otra vez.</p>';
}else{
  c.innerHTML='<p>Esta página es solo para conectar la cuenta de TikTok de La Guayaba Ilustrada. Escribe "tiktok" al bot de Telegram para empezar.</p>';
}
</script>
</body></html>
